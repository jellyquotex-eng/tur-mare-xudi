<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Location</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{--bg:#f3f6f4;--panel:#fff;--ink:#16211c;--mute:#5d6b64;--ok:#14804a;--warn:#b26a00;--bad:#c0392b;--line:#d9e1dc}
@media(prefers-color-scheme:dark){:root{--bg:#10161a;--panel:#18211f;--ink:#e8f0ec;--mute:#93a39b;--ok:#4cc38a;--warn:#f0a63a;--bad:#ff7a6b;--line:#2a3733}}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
header{padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;flex-wrap:wrap}
#dot{width:12px;height:12px;border-radius:50%;background:var(--bad)}
#status{font-weight:700;font-size:17px}
#meta{color:var(--mute);font-size:14px;flex:1 1 240px}
#gm{background:var(--ink);color:var(--bg);text-decoration:none;padding:9px 14px;border-radius:6px;font-size:14px;font-weight:600}
#gm[hidden]{display:none}
#map{flex:1;min-height:300px}
footer{padding:8px 16px;font-size:13px;color:var(--mute);background:var(--panel);border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <span id="dot"></span>
  <span id="status">Connecting...</span>
  <span id="meta"></span>
  <a id="gm" href="#" target="_blank" rel="noopener" hidden>Open in Google Maps</a>
</header>
<div id="map"></div>
<footer id="foot">Updates every 3 seconds</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ====== SHUDHU EI LINE ta bodlao ======
const DB_URL = "https://my-website-ctg-default-rtdb.firebaseio.com";
// =====================================

const LIVE_MAX_SEC = 90;   // ei somoyer moddhe update na ashle "Last known"
const map = L.map('map').setView([21.4272, 92.0058], 5);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom:19, attribution:'&copy; OpenStreetMap'}).addTo(map);
let marker = null, firstFix = true;

const $ = id => document.getElementById(id);
function setStatus(text, color){
  $('status').textContent = text;
  $('status').style.color = color;
  $('dot').style.background = color;
}
function ago(s){
  if(s < 60) return s + " sec age";
  if(s < 3600) return Math.floor(s/60) + " min age";
  return Math.floor(s/3600) + " hour age";
}

async function tick(){
  try{
    const r = await fetch(DB_URL + "/location.json?_=" + Date.now(), {cache:"no-store"});
    const d = await r.json();
    if(!d || typeof d.lat !== "number"){
      setStatus("Device theke data ashe ni", "var(--bad)");
      $('meta').textContent = "ESP32 on kore GPS fix er opekkha korun.";
      return;
    }
    const pos = [d.lat, d.lng];
    if(!marker) marker = L.circleMarker(pos,{radius:9,weight:3,color:"#fff",fillColor:"#1a73e8",fillOpacity:1}).addTo(map);
    marker.setLatLng(pos);
    if(firstFix){ map.setView(pos, 17); firstFix = false; }
    else if(!map.getBounds().contains(pos)) map.panTo(pos);

    const age = d.ts ? Math.max(0, Math.round(Date.now()/1000 - d.ts/1000)) : null;
    const live = d.live && (age === null || age < LIVE_MAX_SEC);
    setStatus(live ? "LIVE location" : "Last known location", live ? "var(--ok)" : "var(--warn)");
    $('meta').textContent = d.lat.toFixed(6)+", "+d.lng.toFixed(6)+
      " | Sat: "+(d.sats||0)+" | Speed: "+(d.speed||0).toFixed(1)+" km/h"+
      (age!==null ? " | "+ago(age) : "");
    $('gm').href = "https://www.google.com/maps?q="+d.lat+","+d.lng;
    $('gm').hidden = false;
    $('foot').textContent = "Updates every 3 seconds";
  }catch(e){
    setStatus("Internet / database connection nai", "var(--bad)");
    $('foot').textContent = "DB_URL thik ache kina ar internet check korun.";
  }
}
tick(); setInterval(tick, 3000);
</script>
</body>
</html>
